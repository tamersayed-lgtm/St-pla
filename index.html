<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقاتي - النسخة المتكاملة</title>
    <!-- مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        playBg: '#202124',
                        playCard: '#303134',
                        playGreen: '#01875f',
                        playGreenLight: '#81c995',
                        playText: '#e8eaed',
                        playMuted: '#9aa0a6'
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #202124; color: #e8eaed; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .install-btn:active { transform: scale(0.95); }
        .app-icon-squircle { border-radius: 22.5%; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased">

    <!-- ============================================== -->
    <!-- 1. الشاشة الرئيسية للمتجر -->
    <!-- ============================================== -->
    <div id="mainStore" class="pb-20">
        
        <!-- شريط البحث -->
        <header class="sticky top-0 z-40 bg-playBg/95 backdrop-blur-sm px-4 py-3 shadow-md">
            <div class="relative max-w-2xl mx-auto flex items-center bg-playCard rounded-full px-4 py-2 shadow-sm border border-gray-700/50">
                <i class="fa-solid fa-search text-playMuted text-lg"></i>
                <input type="text" id="searchInput" placeholder="البحث عن تطبيقات..." 
                       class="w-full bg-transparent text-playText px-3 focus:outline-none text-sm placeholder-playMuted">
                <div class="w-8 h-8 rounded-full bg-playGreen flex items-center justify-center text-white text-sm font-bold">
                    M
                </div>
            </div>
        </header>

        <main class="max-w-2xl mx-auto mt-4">
            <div id="statusBox" class="hidden mx-4 mb-4 p-4 rounded-xl bg-playCard text-sm text-playMuted text-center"></div>
            
            <!-- قسم: مقترح لك (السلايدر الأفقي) -->
            <section class="mb-6">
                <div class="flex justify-between items-center px-4 mb-3">
                    <h2 class="text-lg font-medium text-playText">مقترح لك</h2>
                    <i class="fa-solid fa-arrow-left text-playText"></i>
                </div>
                <div class="flex gap-4 overflow-x-auto hide-scroll snap-x px-4 pb-2" id="featuredContainer"></div>
            </section>

            <!-- قسم: كل التطبيقات (القائمة العمودية) -->
            <section>
                <div class="px-4 mb-3 border-t border-gray-800 pt-4">
                    <h2 class="text-lg font-medium text-playText">كل التطبيقات</h2>
                </div>
                <div class="flex flex-col px-4" id="appListContainer"></div>
            </section>

        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="fixed bottom-0 w-full bg-playBg border-t border-playCard z-40">
            <ul class="flex justify-around items-center pt-2 pb-3">
                <li class="flex flex-col items-center w-16 text-playGreenLight cursor-pointer">
                    <div class="bg-playGreenLight/20 px-4 py-1 rounded-full mb-1">
                        <i class="fa-solid fa-layer-group text-lg"></i>
                    </div>
                    <span class="text-[11px] font-medium">التطبيقات</span>
                </li>
                <li class="flex flex-col items-center w-16 text-playMuted hover:text-playText transition-colors cursor-pointer">
                    <div class="px-4 py-1 mb-1">
                        <i class="fa-solid fa-gamepad text-lg"></i>
                    </div>
                    <span class="text-[11px] font-medium">الألعاب</span>
                </li>
                <li class="flex flex-col items-center w-16 text-playMuted hover:text-playText transition-colors cursor-pointer">
                    <div class="px-4 py-1 mb-1">
                        <i class="fa-solid fa-magnifying-glass text-lg"></i>
                    </div>
                    <span class="text-[11px] font-medium">بحث</span>
                </li>
            </ul>
        </nav>
    </div>

    <!-- ============================================== -->
    <!-- 2. شاشة تفاصيل التطبيق (مخفية افتراضياً) -->
    <!-- ============================================== -->
    <div id="appDetailsScreen" class="hidden fixed inset-0 bg-playBg z-50 overflow-y-auto fade-in pb-10">
        <!-- زر الرجوع -->
        <div class="sticky top-0 bg-playBg/95 backdrop-blur-sm px-4 py-4 flex items-center gap-4 z-10">
            <i class="fa-solid fa-arrow-right text-playText text-xl cursor-pointer p-2 rounded-full hover:bg-playCard" onclick="closeAppDetails()"></i>
            <i class="fa-solid fa-search text-playText text-xl mr-auto cursor-pointer p-2"></i>
            <i class="fa-solid fa-ellipsis-vertical text-playText text-xl cursor-pointer p-2"></i>
        </div>
        
        <div class="px-5 py-2 max-w-2xl mx-auto">
            <!-- تفاصيل الهيدر -->
            <div class="flex gap-4 mb-6 mt-2">
                <div id="detailIconWrapper" class="relative overflow-hidden w-[84px] h-[84px] app-icon-squircle flex items-center justify-center shrink-0 shadow-lg">
                    <i id="detailIcon" class="text-4xl text-white"></i>
                    <img id="detailIconImg" alt="" class="absolute inset-0 w-full h-full object-cover hidden">
                </div>
                <div class="flex-col justify-center flex-1">
                    <h1 id="detailTitle" class="text-2xl font-bold text-playText leading-tight mb-1">الاسم</h1>
                    <p id="detailDev" class="text-playGreenLight text-sm font-medium mb-1">المطور</p>
                    <!-- جملة الإعلانات، سيتم التحكم بظهورها من الجافاسكريبت -->
                    <p id="adsText" class="text-playMuted text-[11px] hidden">يحتوي على إعلانات • عمليات شراء</p>
                </div>
            </div>

            <!-- الإحصائيات -->
            <div class="flex items-center justify-between text-center mb-6 text-playText px-2">
                <div class="flex-1 border-l border-gray-700">
                    <div class="text-[15px] font-bold flex items-center justify-center gap-1">
                        <span id="detailRating">4.8</span> <i class="fa-solid fa-star text-[10px]"></i>
                    </div>
                    <div class="text-[11px] text-playMuted mt-1">المراجعات</div>
                </div>
                <div class="flex-1 border-l border-gray-700">
                    <div class="text-[15px] font-bold" id="detailSize">14 MB</div>
                    <div class="text-[11px] text-playMuted mt-1">الحجم</div>
                </div>
                <div class="flex-1">
                    <div class="text-[15px] font-bold" id="detailDownloads">+10K</div>
                    <div class="text-[11px] text-playMuted mt-1">التنزيلات</div>
                </div>
            </div>

            <!-- حاوية زر التثبيت وأنيميشن التحميل -->
            <div id="btnContainer" class="mb-6 h-10 flex justify-center items-center">
                <!-- سيتم حقن الزر هنا -->
            </div>

            <!-- لقطات الشاشة -->
            <div id="shotsSection" class="hidden mb-6">
                <div id="shotsContainer" class="flex gap-3 overflow-x-auto hide-scroll snap-x"></div>
            </div>

            <!-- الوصف -->
            <div>
                <h2 class="text-[16px] font-medium text-playText mb-3">لمحة عن هذا التطبيق</h2>
                <p id="detailDesc" class="text-[13px] text-playText/80 leading-relaxed whitespace-pre-line"></p>
                <div class="grid grid-cols-2 gap-4 mt-6 border-t border-gray-800 pt-4">
                    <div>
                        <p class="text-playText font-medium text-sm">الإصدار</p>
                        <p id="detailVersion" class="text-playMuted text-xs mt-1">1.0</p>
                    </div>
                    <div>
                        <p class="text-playText font-medium text-sm">تاريخ التحديث</p>
                        <p id="detailUpdated" class="text-playMuted text-xs mt-1">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- سكربت جافاسكريبت -->
    <!-- ============================================== -->
    <script>
        const DATA_URL = 'apps.json';
        let appsData = {};

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const hasLink = l => l && l !== '#';

        function iconHTML(app, wrapSize, iconSize, extra = '') {
            const img = app.icon ? `<img src="${esc(app.icon)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : '';
            return `<div class="relative overflow-hidden ${wrapSize} bg-gradient-to-br ${esc(app.bgClass)} app-icon-squircle flex items-center justify-center shrink-0 shadow-sm ${extra}"><i class="${esc(app.iconClass)} ${iconSize} text-white"></i>${img}</div>`;
        }

        // --- تحميل داخل المتجر ثم تثبيت ---
        const downloadedFiles = {};   // id -> Blob (الملفات التي تم تحميلها داخل المتجر)
        const APK_MIME = 'application/vnd.android.package-archive';

        function setBtn(html, cls) {
            const btn = document.getElementById('detailDownloadBtn');
            if (!btn) return null;
            btn.removeAttribute('style');
            btn.className = cls;
            btn.innerHTML = html;
            return btn;
        }

        const BTN_GREEN = 'block w-full bg-playGreen text-white text-center rounded-full font-medium install-btn text-sm h-10 transition-all duration-300';

        function showDownloadButton(app) {
            const btn = setBtn('تحميل', BTN_GREEN);
            btn.dataset.busy = 'false';
            btn.onclick = () => startDownload(app);
        }

        function showInstallButton(app) {
            const btn = setBtn('تثبيت', BTN_GREEN);
            btn.dataset.busy = 'false';
            btn.onclick = () => startInstall(app);
        }

        // المرحلة 1: التحميل الفعلي داخل المتجر مع شريط تقدم حقيقي
        async function startDownload(app) {
            const btn = document.getElementById('detailDownloadBtn');
            if (btn.dataset.busy === 'true') return;
            btn.dataset.busy = 'true';

            btn.className = 'install-btn';
            btn.style.cssText = 'width:40px;height:40px;padding:0;border-radius:50%;background:transparent';
            btn.innerHTML = `
                <div class="relative w-10 h-10 flex justify-center items-center">
                    <svg class="absolute w-10 h-10 transform -rotate-90" viewBox="0 0 36 36">
                        <path stroke-width="3" stroke="#303134" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="progCircle" stroke-width="3" stroke-dasharray="0, 100" stroke="#01875f" fill="none" class="transition-all duration-200 ease-linear" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <div id="progText" class="absolute flex items-center justify-center text-[10px] font-bold text-playText mt-0.5">0%</div>
                </div>`;

            const setProgress = p => {
                p = Math.max(0, Math.min(100, Math.round(p)));
                const c = document.getElementById('progCircle'), t = document.getElementById('progText');
                if (c) c.setAttribute('stroke-dasharray', `${p}, 100`);
                if (t) t.textContent = p + '%';
            };

            try {
                const res = await fetch(app.downloadLink);
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const total = parseInt(res.headers.get('content-length') || '0', 10);
                const chunks = [];
                let received = 0;

                if (res.body && res.body.getReader) {
                    const reader = res.body.getReader();
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.length;
                        // إن لم يُعرف الحجم الكلي نُقدّر التقدم تقريبياً
                        setProgress(total ? (received / total) * 100 : 90 * (1 - Math.exp(-received / (5 * 1024 * 1024))));
                    }
                } else {
                    chunks.push(new Uint8Array(await res.arrayBuffer()));
                }

                downloadedFiles[app.id] = new Blob(chunks, { type: APK_MIME });
                setProgress(100);
                setTimeout(() => showInstallButton(app), 400);
            } catch (err) {
                console.error('Download failed:', err);
                // احتياطي: إذا منع الخادم التحميل من داخل الصفحة (CORS) ننزّل عبر المتصفح مباشرة
                window.location.href = app.downloadLink;
                showDownloadButton(app);
            }
        }

        // المرحلة 2: عند الضغط على "تثبيت" يُسلَّم الملف للجهاز فيظهر مثبّت الحزم
        function startInstall(app) {
            const blob = downloadedFiles[app.id];
            if (!blob) return showDownloadButton(app);

            const btn = document.getElementById('detailDownloadBtn');
            if (btn.dataset.busy === 'true') return;
            btn.dataset.busy = 'true';
            btn.className = 'block w-full text-center rounded-full font-medium text-sm h-10 border border-gray-600';
            btn.innerHTML = '<span class="text-playMuted text-sm font-medium">جاري التثبيت...</span>';

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (app.id || 'app') + '.apk';
            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(() => {
                URL.revokeObjectURL(url);
                showInstallButton(app);   // يبقى الزر متاحاً إن أُغلق المثبّت
            }, 2500);
        }

        function renderApps() {
            const list = document.getElementById('appListContainer');
            const featured = document.getElementById('featuredContainer');
            list.innerHTML = ''; featured.innerHTML = '';

            Object.values(appsData).forEach(app => {
                list.insertAdjacentHTML('beforeend', `
                <div class="app-item flex items-center py-3 border-b border-playCard/50 cursor-pointer" data-open="${esc(app.id)}">
                    ${iconHTML(app, 'w-14 h-14', 'text-xl', 'ml-4')}
                    <div class="flex-1 min-w-0 pr-1">
                        <h3 class="text-[15px] text-playText font-medium truncate mb-0.5">${esc(app.title)}</h3>
                        <p class="text-[12px] text-playMuted truncate mb-0.5">${esc(app.category)}</p>
                        <div class="flex items-center text-[11px] text-playMuted">
                            <span>${esc(app.rating)}</span><i class="fa-solid fa-star text-[9px] mx-1"></i><span class="mx-1">•</span><span>${esc(app.size)}</span>
                        </div>
                    </div>
                </div>`);

                if (app.featured) {
                    featured.insertAdjacentHTML('beforeend', `
                    <div class="flex flex-col w-24 snap-start shrink-0 cursor-pointer" data-open="${esc(app.id)}">
                        ${iconHTML(app, 'w-24 h-24', 'text-3xl', 'mb-2')}
                        <h3 class="text-[13px] text-playText leading-tight mb-1 truncate">${esc(app.title)}</h3>
                    </div>`);
                }
            });
        }

        function openAppDetails(id) {
            const d = appsData[id];
            if (!d) return;

            const set = (k, v) => document.getElementById(k).textContent = v;
            set('detailTitle', d.title);
            set('detailDev', d.dev);
            set('detailRating', d.rating);
            set('detailSize', d.size);
            set('detailDownloads', d.downloads);
            set('detailVersion', d.version);
            set('detailDesc', d.description);
            set('detailUpdated', d.updated ? new Date(d.updated).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : '-');

            // التحكم في ظهور جملة الإعلانات
            const adsElement = document.getElementById('adsText');
            if(d.hasAds) {
                adsElement.style.display = 'block';
            } else {
                adsElement.style.display = 'none';
            }

            // تهيئة زر التثبيت
            const btnContainer = document.getElementById('btnContainer');
            btnContainer.innerHTML = `<button id="detailDownloadBtn" class="${BTN_GREEN}">تحميل</button>`;
            const newBtn = document.getElementById('detailDownloadBtn');

            if (hasLink(d.downloadLink)) {
                if (downloadedFiles[d.id]) showInstallButton(d); else showDownloadButton(d);
            } else {
                newBtn.textContent = 'قريباً';
                newBtn.className = 'block w-full bg-playCard text-playMuted text-center rounded-full font-medium text-sm h-10';
            }

            document.getElementById('detailIconWrapper').className = `relative overflow-hidden w-[84px] h-[84px] app-icon-squircle flex items-center justify-center shrink-0 shadow-lg bg-gradient-to-br ${d.bgClass}`;
            document.getElementById('detailIcon').className = `text-4xl text-white ${d.iconClass}`;

            const img = document.getElementById('detailIconImg');
            img.classList.add('hidden');
            if (d.icon) {
                img.onload = () => img.classList.remove('hidden');
                img.src = d.icon;
            }

            const shotsSection = document.getElementById('shotsSection');
            const shots = document.getElementById('shotsContainer');
            shots.innerHTML = '';
            const list = (d.screenshots || []).filter(Boolean);
            list.forEach(src => shots.insertAdjacentHTML('beforeend', `<img src="${esc(src)}" loading="lazy" alt="" class="h-56 rounded-xl snap-start shrink-0 bg-playCard">`));
            shotsSection.classList.toggle('hidden', list.length === 0);

            document.getElementById('mainStore').style.display = 'none';
            const screen = document.getElementById('appDetailsScreen');
            screen.classList.remove('hidden');
            screen.scrollTop = 0;
        }

        function closeAppDetails() {
            document.getElementById('appDetailsScreen').classList.add('hidden');
            document.getElementById('mainStore').style.display = 'block';
        }

        document.getElementById('mainStore').addEventListener('click', e => {
            const open = e.target.closest('[data-open]');
            if (open) openAppDetails(open.dataset.open);
        });

        // البحث
        document.getElementById('searchInput').addEventListener('input', e => {
            const term = e.target.value.trim().toLowerCase();
            document.querySelectorAll('.app-item').forEach(item => {
                const t = item.querySelector('h3').textContent.toLowerCase();
                const c = item.querySelector('p').textContent.toLowerCase();
                item.style.display = (t.includes(term) || c.includes(term)) ? 'flex' : 'none';
            });
        });

        async function loadApps() {
            const box = document.getElementById('statusBox');
            box.textContent = 'جاري تحميل التطبيقات...';
            box.classList.remove('hidden');
            try {
                const res = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                appsData = {};
                (json.apps || []).forEach(a => { if (a && a.id) appsData[a.id] = a; });
                if (json.storeName) document.title = json.storeName;
                renderApps();
                box.classList.add('hidden');
                if (!Object.keys(appsData).length) {
                    box.textContent = 'لا توجد تطبيقات حالياً.';
                    box.classList.remove('hidden');
                }
            } catch (err) {
                box.innerHTML = 'تعذّر تحميل <b>apps.json</b>.<br>تأكد أن الملف بجوار index.html.';
                console.error(err);
            }
        }
        loadApps();
    </script>
</body>
</html>
